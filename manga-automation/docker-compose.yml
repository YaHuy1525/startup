networks:
  manga-net:
    driver: bridge

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks: [ manga-net ]
    environment:
      POSTGRES_DB: manga_automation
      POSTGRES_USER: manga_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U manga_user -d manga_automation" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [ manga-net ]
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Mastra AI Agents (Node 20) — Trend Detection + Content Creation ───────────
  manga-agents:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ manga-net ]
    environment:
      DATABASE_URL: postgresql://manga_user:${DB_PASSWORD}@postgres:5432/manga_automation
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      PANELS_DIR: /data/panels
      VIDEOS_DIR: /data/videos
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    volumes:
      - ./data/panels:/data/panels
      - ./data/videos:/data/videos
      - ./data/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Python Worker (FFmpeg + Playwright + CrewAI + Engage + Monetize) ──────────
  python-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    networks: [ manga-net ]
    # Pass through posting / platform keys from .env (POSTIZ_*, META_*, PINTEREST_*, etc.).
    # Values under `environment:` below still override env_file when the same key is set.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://manga_user:${DB_PASSWORD}@postgres:5432/manga_automation
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      TIKTOK_EMAIL: ${TIKTOK_EMAIL}
      TIKTOK_PASSWORD: ${TIKTOK_PASSWORD}
      PANELS_DIR: /data/panels
      VIDEOS_DIR: /data/videos
      LOGS_DIR: /data/logs
      MAX_UPLOADS_PER_ACCOUNT_DAY: ${MAX_UPLOADS_PER_ACCOUNT_DAY:-3}
      DUPLICATE_MAX_USES: ${DUPLICATE_MAX_USES:-5}
      VIDEO_MIN_DURATION_SECONDS: ${VIDEO_MIN_DURATION_SECONDS:-60}
      SHADOW_BAN_FYP_THRESHOLD: ${SHADOW_BAN_FYP_THRESHOLD:-0.10}
      TIKTOK_UPLOADER_DIR: /TiktokAutoUploader
      TIKTOK_UPLOADER_V2_DIR: /TiktokUploader
      USE_NEW_TIKTOK_UPLOADER: "false"
      APIFY_API: ${APIFY_API}
      APIFY_DATA_SCRAPING_API: ${APIFY_DATA_SCRAPING_API}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN}
      ARBITRAGE_VIDEOS_DIR: /data/arbitrage_videos
      ARBITRAGE_PLATFORMS: ${ARBITRAGE_PLATFORMS:-tiktok}
      CHROMADB_URL: http://chromadb:8000
      # OPEN_ROUTER passed but only used if it has credits; falls back to ANTHROPIC_API_KEY
      OPENROUTER_API_KEY: ${OPEN_ROUTER:-}
      OPEN_ROUTER: ${OPEN_ROUTER:-}
      CREWAI_LLM_PROVIDER: ${CREWAI_LLM_PROVIDER:-anthropic}
      MAX_ASSETS_PER_TREND: ${MAX_ASSETS_PER_TREND:-3}
      VELOCITY_THRESHOLD: ${VELOCITY_THRESHOLD:-0.0}
      REVID_API_KEY: ${REVID_API_KEY:-}
      REVID_VOICE_ID: ${REVID_VOICE_ID:-}
      REVID_BACKGROUND: ${REVID_BACKGROUND:-subway_surfers}
      FINANCE_VIDEO_PROVIDER: ${FINANCE_VIDEO_PROVIDER:-revid}
      PYTHON_WORKER_URL: http://python-worker:8080
      MASTRA_API_URL: http://manga-agents:3001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_WORKER_URL: http://python-worker:8080
      TELEGRAM_MASTRA_URL: http://manga-agents:3001
      LAST30DAYS_COMMAND_TEMPLATE: ${LAST30DAYS_COMMAND_TEMPLATE:-last30days "{query}"}
      LAST30DAYS_DEFAULT_QUERIES: ${LAST30DAYS_DEFAULT_QUERIES:-}
      LAST30DAYS_REGION: ${LAST30DAYS_REGION:-US}
      DEERFLOW_URL: ${DEERFLOW_URL:-http://deerflow:2026}
      DEERFLOW_GATEWAY_URL: ${DEERFLOW_GATEWAY_URL:-http://deerflow:2026/api}
      DEERFLOW_LANGGRAPH_URL: ${DEERFLOW_LANGGRAPH_URL:-http://deerflow:2026/api/langgraph}
      DEERFLOW_MODEL_NAME: ${DEERFLOW_MODEL_NAME:-}
      SUMMON_BACKEND: ${SUMMON_BACKEND:-crewai}
      OBSIDIAN_VAULT_PATH: /data/obsidian-vault
      REFERRAL_HUB_URL: ${REFERRAL_HUB_URL:-https://your-domain.com/links}
      EARNINGS_SCREENSHOTS_DIR: /data/earnings_screenshots
    ports:
      # Host 18080 — avoids conflict with Apache/EDB PEM or AiToEarn on 8080/9080
      - "18080:8080"
    volumes:
      - ./data/panels:/data/panels
      - ./data/videos:/data/videos
      - ./data/music:/data/music:ro
      - ./data/logs:/data/logs
      - ./data/arbitrage_videos:/data/arbitrage_videos
      # Debug NDJSON (session 0f0c72) — same path as worker resolves via /app/debug-0f0c72.log
      - ../debug-0f0c72.log:/app/debug-0f0c72.log
      - ./scripts:/app/scripts:ro
      - ../TiktokAutoUploader:/TiktokAutoUploader:ro
      - ../TiktokUploader:/TiktokUploader
      - ./data/obsidian-vault:/data/obsidian-vault
      - ./data/earnings_screenshots:/data/earnings_screenshots
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # ─── Telegram Control Bot ─────────────────────────────────────────────────────
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    networks: [ manga-net ]
    command: [ "python3", "-u", "scripts/telegram_bot.py" ]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_POLL_INTERVAL: ${TELEGRAM_POLL_INTERVAL:-2}
      TELEGRAM_WORKER_URL: http://python-worker:8080
      TELEGRAM_MASTRA_URL: http://manga-agents:3001
      DEERFLOW_URL: ${DEERFLOW_URL:-http://deerflow:2026}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/logs:/data/logs
      - ./data/videos:/data/videos:ro
      - ./data/arbitrage_videos:/data/arbitrage_videos:ro
      - ./data/obsidian-vault:/data/obsidian-vault
    depends_on:
      python-worker:
        condition: service_started
      manga-agents:
        condition: service_healthy

  # ─── Scheduled last30days Research Ingest ─────────────────────────────────────
  research-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    networks: [ manga-net ]
    command: [ "python3", "-u", "scripts/research_scheduler.py" ]
    environment:
      DATABASE_URL: postgresql://manga_user:${DB_PASSWORD}@postgres:5432/manga_automation
      LOGS_DIR: /data/logs
      LAST30DAYS_COMMAND_TEMPLATE: ${LAST30DAYS_COMMAND_TEMPLATE:-last30days "{query}"}
      LAST30DAYS_DEFAULT_QUERIES: ${LAST30DAYS_DEFAULT_QUERIES:-}
      LAST30DAYS_REGION: ${LAST30DAYS_REGION:-US}
      LAST30DAYS_SCHEDULE_SECONDS: ${LAST30DAYS_SCHEDULE_SECONDS:-21600}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy

  # ─── DeerFlow Hybrid Planning Layer (optional profile) ───────────────────────
  deerflow:
    image: ghcr.io/bytedance/deer-flow:main
    restart: unless-stopped
    profiles: [ "deerflow" ]
    networks: [ manga-net ]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "2026:2026"

  # ─── n8n Orchestrator ─────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    networks: [ manga-net ]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: manga_automation
      DB_POSTGRESDB_USER: manga_user
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:5679/
      N8N_EDITOR_BASE_URL: http://${N8N_HOST:-localhost}:5679/
      EXECUTIONS_PROCESS: main
      GENERIC_TIMEZONE: America/New_York
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console,file
      N8N_LOG_FILE_LOCATION: /home/node/.n8n/logs/n8n.log
      # Agent server URL (internal network)
      MANGA_AGENTS_URL: http://manga-agents:3001
    ports:
      - "5679:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/panels:/data/panels
      - ./data/videos:/data/videos
    depends_on:
      postgres:
        condition: service_healthy
      manga-agents:
        condition: service_healthy

  # ─── OpenClaw Gateway ─────────────────────────────────────────────────────────
  # openclaw-gateway:
  #   image: openclaw/gateway:latest
  #   container_name: openclaw-gateway
  #   networks: [ manga-net ]
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - APIFY_API_TOKEN=${APIFY_API_TOKEN}
  #     - DATABASE_URL=postgresql://manga_user:${DB_PASSWORD}@postgres:5432/manga_automation
  #   volumes:
  #     - ./openclaw_config:/app/config
  #     - ./data/videos:/data/videos
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy


  # ─── ChromaDB Vector Memory ───────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    networks: [ manga-net ]
    volumes:
      - ./data/chromadb:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q heartbeat" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Dashboard (Vite + Nginx) ──────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ manga-net ]
    ports:
      - "3000:80"
    depends_on:
      manga-agents:
        condition: service_healthy
