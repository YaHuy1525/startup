server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to manga-agents backend
    location /dashboard/ {
        proxy_pass http://manga-agents:3001/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /pipeline/ {
        proxy_pass http://manga-agents:3001/pipeline/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agents/ {
        proxy_pass http://manga-agents:3001/agents/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://manga-agents:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /arbitrage/ {
        proxy_pass http://manga-agents:3001/arbitrage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Exact /publish (POST) and /publish/* (accounts, status). Kept separate so the
    # SPA route /publisher is NOT captured by a /publish prefix.
    location = /publish {
        proxy_pass http://manga-agents:3001/publish;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /publish/ {
        proxy_pass http://manga-agents:3001/publish/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /agent/ {
        proxy_pass http://manga-agents:3001/agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location /health {
        proxy_pass http://manga-agents:3001/health;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
