server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to manga-agents backend
    location /dashboard/ {
        proxy_pass http://manga-agents:3001/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /pipeline/ {
        proxy_pass http://manga-agents:3001/pipeline/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agents/ {
        proxy_pass http://manga-agents:3001/agents/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://manga-agents:3001/health;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
